# Lint, type-check and test the backend, and check that its Docker image builds.
# No API key is needed: tests against the real GitHub, Voyage and Anthropic APIs
# (-m live) are not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as docker-compose.yml. The integration tests use the uaw_test database.
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: uaw
          POSTGRES_PASSWORD: uaw
          POSTGRES_DB: uaw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uaw -d uaw_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest
      - name: Integration tests (PostgreSQL + pgvector)
        run: uv run pytest -m db

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: uaw-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
