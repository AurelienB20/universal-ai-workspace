[project]
name = "universal-ai-workspace"
version = "0.1.0"
description = "Connect your data. Ask anything. Get answers backed by evidence."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "uaw"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# faulthandler is disabled: on Windows it prints a harmless, already-handled WMI error
# raised while SQLAlchemy imports `platform`, on every run.
addopts = "-ra --strict-markers -p no:faulthandler -m 'not live and not db'"
markers = [
    "live: calls real external services over the network (opt-in: -m live)",
    "db: needs the PostgreSQL database from docker-compose.yml (opt-in: -m db)",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
