# Database only (default): docker compose up -d db
# Database + API + web interface in containers: docker compose --profile app up -d --build
# The credentials below are for local development only.
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: uaw
      POSTGRES_PASSWORD: uaw
      POSTGRES_DB: uaw
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is created: adds the uaw_test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaw -d uaw"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    # Not started by default: the API usually runs from the venv during development.
    profiles: ["app"]
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://uaw:uaw@db:5432/uaw
      # Local containers: no reverse proxy, readable logs.
      APP_ENV: local
      LOG_FORMAT: text
      # Trust X-Forwarded-For from the web container (local only: ports bound to
      # 127.0.0.1), so that rate limits apply per browser, not to the web server.
      FORWARDED_ALLOW_IPS: "*"
      # Same source as the web container (the shell, or a .env file next to this
      # one), so both always share the same key. Overrides API_KEY from backend/.env.
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    build: ./frontend
    environment:
      API_URL: http://api:8000
      # Same value as the api container's API_KEY (see above).
      API_KEY: ${API_KEY:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  pgdata:
