# Local development services. Start with: docker compose up -d
# The credentials below are for local development only.
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: uaw
      POSTGRES_PASSWORD: uaw
      POSTGRES_DB: uaw
    ports:
      # Bound to localhost only: the database is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is created: adds the uaw_test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uaw -d uaw"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
